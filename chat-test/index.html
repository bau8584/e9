<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>힙독 시험 대화</title>
<style>
:root{--bg:#FAF5E9;--ink:#241B2E;--accent:#4B1F78;--deep:#2A1147;--gold:#B8862B;--line:#ddd3c0;--paper:#fffdf7;--muted:#5f5668;--error:#9c2b2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}
.app{max-width:560px;height:100dvh;margin:auto;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line)}
.who{display:flex;gap:8px;align-items:center}
.who button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.who button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{margin-left:auto;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 6px}
.status{margin:8px 0 0;font-weight:700;font-family:"Noto Serif KR",serif}
.steps{color:var(--gold);margin-left:6px;letter-spacing:2px}
.quest{margin:4px 0 0;font-size:14px;color:var(--muted)}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{margin:0;max-width:85%;padding:10px 14px;border-radius:10px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.them{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.me{align-self:flex-end;background:var(--accent);color:#fff}
.note{margin:0;align-self:center;font-size:13px;color:var(--error);text-align:center}
.wait{margin:0;align-self:flex-start;font-size:13px;color:var(--muted)}
.scene{margin:12px 0;padding:16px;border-radius:10px;background:var(--deep);color:#fff;border:1px solid var(--gold)}
.scene h2{margin:0 0 8px;font:700 16px "Noto Serif KR",serif;color:#e8c777}
.scene p{margin:6px 0 0;line-height:1.55}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;min-height:44px;padding:0 12px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:inherit}
button{min-height:44px;padding:0 16px;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.5}
@media (prefers-reduced-motion:no-preference){.scene{animation:rise .45s cubic-bezier(.16,1,.3,1)}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who">
      <button type="button" data-id="xunzi">순자</button>
      <button type="button" data-id="nietzsche">니체</button>
      <span class="tag">AI 각색 · 시험판</span>
    </div>
    <p class="status"><span id="title"></span><span class="steps" id="steps"></span></p>
    <p class="quest" id="quest"></p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="text" maxlength="500" autocomplete="off" aria-label="보낼 말" placeholder="보낼 말">
    <button id="send">보내기</button>
  </form>
</div>
<script>
let game, current = 'xunzi';
const state = { xunzi: { stage: 0, history: [] }, nietzsche: { stage: 0, history: [] } };
const log = document.querySelector('#log');
const text = document.querySelector('#text');
const send = document.querySelector('#send');
function add(cls, content, tag = 'p') {
  const el = document.createElement(tag);
  el.className = cls;
  el.textContent = content;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function showStatus() {
  const s = state[current], stage = game[current].stages[s.stage];
  document.querySelector('#title').textContent = stage.title;
  document.querySelector('#steps').textContent = '◆'.repeat(s.stage + 1) + '◇'.repeat(3 - s.stage);
  document.querySelector('#quest').textContent = stage.quest ? `도전: ${stage.quest.label}. ${stage.quest.hint}` : '모든 도전을 깼어요.';
  document.querySelectorAll('.who button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === current));
}
function showScene(lines, title) {
  const box = document.createElement('section');
  box.className = 'scene';
  const h = document.createElement('h2');
  h.textContent = `${title} 달성`;
  box.append(h);
  lines.forEach((line) => { const p = document.createElement('p'); p.textContent = line; box.append(p); });
  log.append(box);
  log.scrollTop = log.scrollHeight;
}
function open(id) {
  current = id;
  log.replaceChildren();
  add('b them', game[id].opening);
  state[id].history.forEach((m) => {
    if (m.role === 'user') add('b me', m.content); else m.content.split('\n').forEach((b) => add('b them', b));
  });
  showStatus();
}
document.querySelectorAll('.who button').forEach((b) => b.addEventListener('click', () => open(b.dataset.id)));
document.querySelector('#form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const content = text.value.trim();
  if (!content || send.disabled) return;
  const id = current, s = state[id];
  text.value = '';
  send.disabled = true;
  add('b me', content);
  s.history.push({ role: 'user', content });
  const waiting = add('wait', `${game[id].name}가 답을 쓰는 중…`);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ character: id, stage: s.stage, messages: s.history }),
    });
    const data = await res.json();
    waiting.remove();
    if (!res.ok) throw new Error(data.error);
    data.bubbles.forEach((b) => add('b them', b));
    s.history.push({ role: 'assistant', content: data.bubbles.join('\n') });
    if (data.questDone) {
      const cleared = game[id].stages[s.stage].quest.label;
      s.stage = data.stage;
      showScene(data.scene ?? [], cleared);
      showStatus();
    }
  } catch (error) {
    waiting.remove();
    s.history.pop();
    text.value = content;
    add('note', error.message || '연결이 끊겼어요. 다시 보내 주세요.');
  } finally {
    send.disabled = false;
    text.focus();
  }
});
fetch('/game').then((r) => r.json()).then((g) => { game = g; open(current); });
</script>
</body>
</html>
