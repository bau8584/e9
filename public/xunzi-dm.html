</style><dialog aria-label="순자 DM"><header><button id="back" aria-label="뒤로">‹</button><span class="avatar"></span><strong>순자</strong><small>AI 재해석</small></header><section id="scroll"><div class="day">오늘</div><div id="messages" aria-live="polite"><div class="row"><span class="avatar"></span><p>오늘, 어떤 습관을 바꾸고 싶나요?</p></div></div><div id="reading"><div class="book">荀子</div><div><b>이 질문과 연결되는 글</b><p>순자 「권학」 · 배움과 습관</p><details><summary>글 읽고 대화하기</summary><p>작은 걸음이 모여 먼 길이 되듯, 배움은 반복하는 실천으로 쌓입니다.</p><small>「권학」의 뜻을 풀어 쓴 글</small></details></div></div><button id="more">다른 관점도 궁금해</button><div id="status" role="status"></div></section><footer>순자의 사상을 AI가 재해석한 가상 대화입니다.</footer><form><input maxlength="1500" required placeholder="순자에게 답장하기" aria-label="답장"><button aria-label="보내기">➤</button></form></dialog><script>const dialog=document.querySelector('dialog'),field=document.querySelector('form input'),sendButton=document.querySelector('form button'),more=document.querySelector('#more'),statusLine=document.querySelector('#status');

}
const records=[{"id":"2","title":"순자와 문헌의 성격","text":"순자 荀子는 전국시대의 유가 사상가로, 이름은 순황 荀況이다. 정확한 생몰년에는 불확실성이 있다. 공자와 맹자로 이어지는 유가 전통 안에서 인간의 수양과 사회 질서를 탐구했으며, 특히 예와 교육의 역할을 강조했다.\n\n현전 『순자』는 후대에 편집된 문헌이다. 모든 편과 문장을 순자의 직접 발언이나 직접 집필로 확정하지 않는다. 이 앱에서 “순자의 입장”은 기본적으로 현전 『순자』에 나타난 철학적 입장을 뜻한다. 특히 「성악」편의 저자와 성 개념에 대해서는 학술적 논쟁이 있으므로, 단일한 해석을 유일한 정답처럼 제시하지 않는다. [S8]","tags":["순황","전국시대","생몰년","저자","생애"]},{"id":"3.1","title":"성은 무엇인가","text":"성 性은 여기서 태어나면서 갖는 성향과 능력, 욕구를 가리킨다. 성격검사의 성격, 한 개인의 도덕적 평판, 일생 동안 변하지 않는 범죄 성향을 뜻하지 않는다.\n\n「성악」편은 이익을 좋아하고 감각적 만족을 추구하며 타인과 경쟁하는 경향을 논한다. 이런 경향을 그대로 따를 때 다툼과 질서의 훼손이 생긴다는 것이 성악 논증의 출발점이다. [S1]","tags":["본성","인간","성향","타고난"]},{"id":"3.2","title":"악은 무엇인가","text":"악 惡은 서구 종교의 원죄와 동일한 개념이 아니다. 욕망을 반성이나 규범 없이 좇을 때 생기는 해로운 행동과 무질서의 맥락에서 이해한다. 다만 순자가 성을 실제로 악하다고 평가한다는 점까지 지워서, 성악설을 단순한 성무선악설로 바꾸어서도 안 된다. [S1, S8]\n\n앱의 기본 설명은 다음과 같다.\n“순자는 인간이 타고난 욕망을 그대로 따르는 것만으로는 선하게 살 수 없다고 보았습니다. 선을 이루려면 배움과 예의, 의식적인 실천이 필요합니다.”","tags":["원죄","악인","성악설","나쁘","악하"]},{"id":"3.3","title":"선은 어떻게 가능한가","text":"「성악」편은 선을 위 偽와 연결한다. 이 문맥의 위는 거짓말이나 위선이라는 뜻이 아니라, 의식적으로 배우고 행하여 만들어 내는 후천적 활동을 가리킨다.\n\n성악설은 변화 불가능론이 아니다. 같은 편은 평범한 사람도 성인의 경지에 이를 가능성을 논한다. 가능성이 있다는 말과 누구나 실제로 그 경지에 도달한다는 말은 구분해야 한다. 꾸준한 실천이 필요하며 성취가 자동으로 보장되지는 않는다. [S1]","tags":["위선","착한척","거짓","노력","偽","변하지","변화"]},{"id":"3.4","title":"화성기위는 어떻게 설명할 것인가","text":"화성기위 化性起偽는 타고난 성향을 교화하고 의식적인 활동을 일으킨다는 수양의 방향이다. 충동을 곧바로 행동으로 옮기는 습관을 바꾸고, 배운 기준에 따라 행동하는 능력을 기르는 것으로 설명할 수 있다.\n\n해석상 유의점: 성 자체가 어느 의미에서 변하는지, 본래의 욕구와 후천적 성취가 어떻게 연결되는지는 논쟁이 있다. 앱은 “교육으로 모든 욕망이 사라진다”거나 “유전적 본성이 바뀐다”고 단정하지 않는다. [S1, S8]","tags":["화성기위","교화","유전"]},{"id":"4","title":"욕망과 마음","text":"원전 설명: 「정명」편은 욕망의 존재와 욕망을 따라 행동할지에 관한 마음의 판단을 구분한다. 질서를 만들기 위해 욕망이 완전히 없어지기를 기다릴 필요는 없다. 욕망이 있다는 사실만으로 행동의 정당성이 결정되는 것도 아니다. [S2]\n\n현대적 적용: 인정받고 싶거나 화가 나거나 편안함을 바라는 마음이 생겼다고 해서 자신을 악인으로 규정할 필요는 없다. 반대로 “자연스러운 욕구다”라는 이유로 타인에게 피해를 주는 행동을 정당화할 수는 없다.\n\n앱은 감정, 욕구, 판단, 행동을 나누어 묻는다.\n• 어떤 일이 있었는가.\n• 그때 무엇을 원했고 어떤 감정이 생겼는가.\n• 실제로 무엇을 했거나 하려고 하는가.\n• 그 행동은 누구에게 어떤 영향을 주는가.\n\n여기서 마음 心은 현대 심리학의 특정 기관이나 진단 개념과 동일시하지 않는다. 순자에게 마음은 알아보고 판단하며 행동을 이끄는 데 중요한 역할을 한다.","tags":["질투","인정","분노","감정","욕망","욕구","친구","화가"]},{"id":"5","title":"예와 의","text":"원전 설명: 「예론」에서 예 禮는 단순한 인사법보다 넓다. 욕구와 재화의 충돌을 조절하고, 관계와 분배에 일정한 질서를 부여하는 문화적 실천이다. 욕망을 없애는 것만이 아니라 적절하게 기르고 충족하는 기능도 갖는다. 예는 감정을 표현할 형식을 제공한다. [S3]\n\n의 義는 마땅함과 옳음의 기준에 관련된다. 예를 겉으로 따르기만 하거나 사익을 위해 형식을 이용하는 일을 충분한 수양으로 보지 않는다.\n\n현대적 적용: 회의의 발언 순서, 협업의 책임과 기여 기준, 갈등에서 지킬 대화 규칙 등을 예의 기능을 설명하는 비유로 사용할 수 있다. 이런 현대 규칙이 곧 고대의 예와 동일하다고 말하지 않는다.\n\n역사적 한계: 순자의 예에는 군주제와 신분 및 역할의 위계가 포함된다. 이를 현대의 평등한 권리나 민주적 합의와 같은 것으로 설명하지 않는다. 현대 앱이 상호 존중과 동등한 권리를 기준으로 응용하는 부분은 별도의 현대적 선택이다. 부당한 차별이나 학대에 복종하라는 지침으로 바꾸지 않는다.","tags":["예론","학대","모욕","상사","분배","발언순서","복종","의례"]},{"id":"6","title":"배움과 실천","text":"원전 설명: 「권학」은 배움을 지속해야 한다고 강조한다. 배움은 지식을 말하는 데 그치지 않고 몸가짐과 행동에 드러나야 한다. 스승과 좋은 본보기, 배움에 적합한 환경도 중요하다. [S4]\n\n현대적 적용: 의지가 부족하다고 자신을 비난하기보다 반복할 행동과 환경을 정한다. 예를 들어 공부를 시작할 시각을 고정하고, 짧은 분량부터 실천하며, 방해 요인을 줄일 수 있다. 이런 구체적 시간 관리법 자체가 순자의 원전 가르침인 것은 아니다.\n\n앱이 권할 수 있는 실천 순서\n① 바꾸려는 행동 하나를 구체적으로 정한다.\n② 지킬 기준과 그 이유를 확인한다.\n③ 오늘 할 수 있는 작은 행동을 정한다.\n④ 도움이 되는 사람과 환경을 찾는다.\n⑤ 결과를 돌아보고 다음 실천을 조정한다.\n\n실패 한 번으로 사람 전체를 평가하지 않는다. 반복되는 실패를 의지 하나로만 설명하지도 않는다. 학습 기회, 자원과 환경을 함께 살피는 것은 이 앱의 현대적 적용 원칙이다.","tags":["공부","계획","휴대폰","습관","학습","권학","미루","실천"]},{"id":"7","title":"편견을 풀고 판단하기","text":"원전 설명: 「해폐」는 한 부분에 가려 전체의 이치를 놓치는 문제를 다룬다. 허일이정 虛壹而靜은 새로운 이해를 막지 않는 비움, 주의를 흐트러뜨리지 않는 집중, 판단을 어지럽히지 않는 고요함과 관련하여 설명할 수 있다. 이는 아무 생각도 하지 않는 상태를 뜻하지 않는다. [S5]\n\n현대적 적용: 상대방의 의도를 단정하기 전에 관찰한 사실과 자신의 추측을 나눈다. 분노가 가라앉은 뒤 다른 설명이 가능한지 살펴본다. 다만 실제 피해가 드러난 상황에서 무조건 양쪽에 같은 잘못이 있다고 몰아가지 않는다.","tags":["편견","추측","선입견","해폐","허일이정","SNS"]},{"id":"8","title":"하늘과 인간의 역할","text":"원전 설명: 「천론」은 하늘의 운행에 일정함이 있음을 논하고, 인간 사회의 질서와 혼란을 하늘의 상벌로 설명하는 태도를 비판한다. 자연의 변화에 맞추어 사람이 준비하고 다스리는 일이 중요하다. [S6]\n\n현대적 적용: “불운이 생겼으니 나는 나쁜 사람이다”라는 생각을 곧바로 받아들이지 않는다. 통제할 수 없는 조건과 준비하거나 바꿀 수 있는 일을 구분하도록 돕는다.\n\n해석상 유의점: 순자를 현대 과학자나 현대적 무신론자로 단정하지 않는다. 재난이나 질병을 겪은 사람에게 “준비를 못한 네 탓”이라고 말하는 근거로 삼지 않는다. 이는 원전의 정치적 논의를 개인에게 무리하게 적용하는 오류다.","tags":["불운","운명","하늘","천론","재난","상벌"]},{"id":"9","title":"이름과 실제를 맞추기","text":"원전 설명: 「정명」은 이름과 실제의 구별, 공통된 언어 사용을 통해 판단과 사회 질서를 세우는 문제를 다룬다. 고대의 정명론에는 통치의 맥락이 있으며, 단순한 현대 대화 요령만을 뜻하지 않는다. [S2]\n\n현대적 적용: “나는 실패자다”라는 총체적 평가를 “이번 시험에서 목표 점수를 얻지 못했다”는 구체적 사실과 구분한다. “공정함”이나 “성공”처럼 뜻이 달라질 수 있는 말은 대화 중 무엇을 의미하는지 확인한다.","tags":["정명","실패자","이름","언어","공정함"]},{"id":"10","title":"음악과 공동체","text":"원전 설명: 「악론」은 음악과 예술적 표현을 단순한 낭비로 보지 않는다. 감정을 일정한 형식 안에서 표현하고 사람들의 조화를 이루는 데 의미가 있다고 본다. 여기서 악 樂은 음악을 뜻하며 성악설의 악 惡과 다른 글자다. [S7]\n\n현대적 적용: 감정을 억누르라는 말만 반복하지 않는다. 함께하는 문화 활동이나 안전한 표현 방식을 제안할 수 있다. 특정 음악이 치료 효과를 보장한다고 주장하지 않는다.","tags":["음악","악론","예술","노래"]},{"id":"11","title":"맹자 및 법가와의 구분","text":"맹자는 도덕적 성장의 내적 단서와 선한 가능성을 강조한다. 순자는 타고난 욕망을 따르는 것만으로 선이 이루어지지 않으며, 배움과 예의가 필요하다고 강조한다. 두 입장은 성이라는 말의 의미와 도덕적 형성을 설명하는 방식에서도 차이가 있다. “맹자는 교육이 필요 없다고 했고 순자만 교육을 주장했다”는 설명은 틀리다. [S1, S8]\n\n또한 순자가 규범과 제도를 중시한다고 해서 그의 사상을 처벌 중심의 통치론으로 환원하지 않는다. 순자의 설명에서 예의와 교육이 차지하는 자리를 보존한다. 성악설을 근거로 인간 불신이나 가혹한 처벌만을 권하면 순자의 수양론을 잃게 된다.","tags":["맹자","법가","처벌","성선설"]}];
function relevant(input,previous=''){
 function score(r,q){return r.tags.reduce((n,k)=>n+(q.includes(k)?4:0),0)+r.title.split(/\s+/).filter(k=>k.length>1&&q.includes(k)).length}
 return [...records].sort((a,b)=>(score(b,input)*10+score(b,previous))-(score(a,input)*10+score(a,previous))).filter(r=>score(r,input)||score(r,previous)).slice(0,2);
}
async function send(text){
 if(sendButton.disabled||!text.trim())return;
 const current={role:'user',content:text.trim()},row=bubble('user',current.content);
 sendButton.disabled=more.disabled=field.disabled=true;field.value='';statusLine.textContent='순자가 답장을 쓰고 있어요…';statusLine.scrollIntoView({block:'nearest'});
 try{
 const engine=await getEngine();
 statusLine.textContent='순자가 답장을 쓰고 있어요…';
 const messages=[...history.slice(1),current].slice(-5);
 while(messages[0]?.role==='assistant')messages.shift();
 const refs=relevant(text,history.filter(m=>m.role==='user').at(-1)?.content||'');
 const notes=refs.map(r=>r.title+'\n'+r.text).join('\n\n');
 const result=await engine.chat.completions.create({messages:[{role:'system',content:"당신은 현전 『순자』의 관점을 재구성한 AI입니다. 사용자의 질문에 차분한 한국어 존댓말로 먼저 답하세요. 감정과 행동을 구분하고 원전 설명과 현대적 적용을 구별하세요. 성악은 타고난 욕망을 그대로 따를 때의 다툼과 의식적 수양의 필요를 함께 설명합니다. 확인되지 않은 직접 인용이나 편명을 만들지 마세요. 자료로 확인할 수 없으면 그 한계를 밝히세요."+'\n참고 자료\n'+notes},...messages],temperature:0.55,max_tokens:230});
 const data={reply:result.choices[0]?.message?.content?.trim()};
 if(!data.reply)throw Error('답장이 비어 있어요. 다시 보내 주세요.');
 history.push(current,{role:'assistant',content:data.reply});statusLine.textContent='';bubble('assistant',data.reply); if(refs.length){const d=document.createElement('details'),s=document.createElement('summary');s.textContent='이번 답변에 제공한 학습 자료';d.append(s);for(const r of refs){const p=document.createElement('p');p.textContent=r.id+' '+r.title+'\n'+r.text;d.append(p)}document.querySelector('#messages').append(d)}
 }catch(e){row.remove();field.value=text;statusLine.textContent=e.message;statusLine.scrollIntoView({block:'nearest'})}
 finally{sendButton.disabled=more.disabled=field.disabled=false;field.focus({preventScroll:true})}
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();send(field.value)};
more.onclick=()=>send('다른 관점도 궁금해요.');
let engine;
async function getEngine(){
 if(engine)return engine;
 const adapter=await navigator.gpu?.requestAdapter();
 if(!adapter)throw Error('이 기기에서는 WebGPU를 사용할 수 없어요. 그래픽 가속이 켜진 최신 Chrome 또는 Edge에서 열어 주세요.');
 statusLine.textContent='처음 한 번, AI 모델을 내려받고 있어요…';
 try{
 const {CreateMLCEngine}=await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
 const variant=adapter.features.has('shader-f16')?'q4f16_1':'q4f32_1';
