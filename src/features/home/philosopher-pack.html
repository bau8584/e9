*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 42%,#35504a 0,#192c2a 42%,#0b191b 85%);min-height:100svh;color:#f7efda;font-family:system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dbc48936;padding:18px clamp(18px,5vw,80px)}.brand{font: bold 24px Georgia,serif;color:#e3cc93}button{font:inherit;cursor:pointer;color:inherit;background:#1c3330;border:1px solid #ad986a;border-radius:30px;padding:10px 20px}button:hover,button:focus-visible{outline:2px solid #e7c979;outline-offset:3px}main{text-align:center;padding:28px 14px 48px}h1,h2,.name{font-family:Georgia,'Nanum Myeongjo',serif}h1{margin:0;font-size:clamp(36px,6vw,65px);letter-spacing:-3px;color:#f7e7bc}p{margin:10px 0 20px;color:#c7d5ca}.stage{min-height:340px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;margin:12px auto 10px;max-width:800px}.pack{position:relative;isolation:isolate;width:215px;height:295px;border-radius:3px;border:1px solid #cfbc81;box-shadow:0 20px 32px #06120ea8,0 0 60px #dec17118;transform:rotate(-4deg);background:linear-gradient(118deg,#081b19 2%,var(--foil) 31%,#a19868 45%,var(--foil) 51%,#142322 86%);overflow:hidden;display:grid;place-content:center;gap:9px}.pack:before,.pack:after{content:'';position:absolute;left:0;right:0;height:15px;background:repeating-linear-gradient(90deg,#a89b6d99 0 2px,#27352c55 2px 5px);border-block:1px solid #e0ca8e99}.pack:before{top:0}.pack:after{bottom:0}.seal{margin:auto;border:3px double #f1d494;border-radius:50%;width:92px;height:92px;display:grid;place-items:center;font:50px serif;color:#f5daa3;background:#15251fa8}.pack b{font: bold 32px serif;text-shadow:0 2px 4px #17271e}.pack small,.serial{font:11px Georgia;letter-spacing:.2em;color:#e5cd90}.peek{width:145px;height:200px;border:3px double #dbbe80;border-radius:9px;object-fit:cover;position:absolute;left:50%;top:50%;box-shadow:0 8px 12px #071514;transform:translate(-110%,- .stage{isolation:isolate;perspective:950px}.stage:has(.pack):before,.stage:has(.card):before{content:'';position:absolute;inset:0 10%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse,#eec57648,transparent 65%);animation:aura 3s ease-in-out infinite alternate}.pack{animation:floatPack 3.5s ease-in-out infinite}.pack i,.card:after{position:absolute;inset:-20% -55%;pointer-events:none;background:linear-gradient(108deg,transparent 43%,#fff6b925 48%,#fff8df88 50%,transparent 55%);transform:translateX(-100%)}.pack i{animation:foil 5s ease-in-out infinite}.pack.opening{animation:unwrap .95s ease-in both}.pack.opening:before{animation:rip .75s ease-out forwards;z-index:3}.stage:has(.opening) .peek{animation:withdraw .55s ease-in both}.spark{position:absolute;left:50%;top:42%;width:5px;height:5px;background:#ffe8ab;box-shadow:0 0 8px #ffe8ab;border-radius:50%;pointer-events:none;animation:burst 1s ease-out both;z-index:4}.backcard{animation:deal .65s cubic-bezier(.18,.8,.32,1) backwards;animation-delay:var(--delay);transform-origin:50% 90%}.backcard.picked{animation:pick .55s ease-in both;z-index:3}.backcard.dismissed{animation:withdraw .4s ease-in both}.card{position:relative;animation:face .68s cubic-bezier(.18,.8,.32,1) both}.card:after{content:'';animation:foil 1.05s .35s ease-out both}
@keyframes floatPack{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(-2deg)}}@keyframes foil{0%,30%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}@keyframes aura{to{opacity:.55;scale:.92}}@keyframes unwrap{0%{transform:rotate(-4deg)}20%{transform:rotate(2deg) scale(1.05)}38%{transform:rotate(-5deg) scale(1.04)}55%{transform:rotate(0) scale(1.07);opacity:1}100%{transform:translateY(45px) scale(.94);opacity:0}}@keyframes rip{0%,20%{translate:0 0}65%{translate:45px 0;rotate:4deg}100%{translate:110px -14px;opacity:0}}@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}@keyframes deal{from{transform:translate(var(--offset),25px) rotate(var(--tilt)) scale(.82);opacity:0}to{transform:none;opacity:1}}@keyframes pick{to{transform:translateX(var(--offset)) translateZ(55px) rotateY(89deg)}}@keyframes withdraw{to{opacity:0;scale:.85}}@keyframes face{from{transform:rotateY(-89deg) scale(.87)}to{transform:none}}

const app=document.querySelector('#app'),album=document.querySelector('#collection');

function count(){album.textContent='내 컬렉션  '+owned.size+' / '+people.length}count();
function begin(title,subtitle){transition++;app.innerHTML='<h1>'+title+'</h1><p>'+subtitle+'</p>';return transition}
function controls(){const box=document.createElement('div');box.className='controls';app.append(box);return box}
function button(parent,label,act,cls=''){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=act;parent.append(b);return b}
function stage(){const box=document.createElement('div');box.className='stage';app.append(box);return box}
function home(){
 const [name,symbol,color,pool]=packs[pack];begin('사유의 초상','오늘 열어 볼 사상가 팩을 고르세요.');const s=stage();
 s.innerHTML='<img class="peek" alt="" src="'+art[pool[0]]+'"><img class="peek right" alt="" src="'+art[pool[1]]+'">';
 const b=button(s,'',openPack,'pack');b.style.setProperty('--foil',color);b.setAttribute('aria-label',name+' 열기');b.innerHTML='<small>HIP讀 COLLECTION</small><span class="seal">'+symbol+'</span><b>'+name+'</b><small>PHILOSOPHER PACK</small><i aria-hidden="true"></i>';
 const bar=controls();button(bar,'‹',()=>{pack=(pack+2)%3;home()}).ariaLabel='이전 팩';button(bar,'이 팩 열기',openPack,'gold');button(bar,'›',()=>{pack=(pack+1)%3;home()}).ariaLabel='다음 팩';
}
function motionDelay(ms){return matchMedia('(prefers-reduced-motion: reduce)').matches?0:ms}
function sparks(parent){
 if(!motionDelay(1))return;
 for(let i=0;i<23;i++){
  const star=document.createElement('i'),angle=i*2.4,radius=75+Math.random()*100;
  star.className='spark';star.setAttribute('aria-hidden','true');
  star.style.setProperty('--dx',Math.cos(angle)*radius+'px');star.style.setProperty('--dy',Math.sin(angle)*radius+'px');
  star.style.animationDelay=Math.random()*.24+'s';parent.append(star);star.onanimationend=()=>star.remove();
 }
}
function turnCard(card,id){
 const token=++transition,stage=card.parentElement;
 stage.querySelectorAll('button').forEach(other=>{other.disabled=true;other.classList.add(other===card?'picked':'dismissed')});
 card.style.setProperty('--offset',(stage.getBoundingClientRect().left+stage.clientWidth/2-card.getBoundingClientRect().left-card.offsetWidth/2)+'px');
 setTimeout(()=>{if(token===transition){reveal(id,true);sparks(app.querySelector('.stage'))}},motionDelay(540))
}
function openPack(){
 const token=++transition;sparks(app.querySelector('.stage'));app.querySelector('.pack').classList.add('opening');app.querySelectorAll('button').forEach(b=>b.disabled=true);
 setTimeout(()=>{if(transition!==token)return;begin(packs[pack][0],'뒷면을 눌러 나의 사상가를 만나세요.');const s=stage(),pool=[...packs[pack][3]];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 pool.slice(0,3).forEach((id,i)=>{const b=button(s,'讀',()=>turnCard(b,id),'backcard');b.style.setProperty('--offset',(1-i)*100+'%');b.style.setProperty('--tilt',(i-1)*18+'deg');b.style.setProperty('--delay',i*90+'ms');b.ariaLabel=(i+1)+'번째 카드 뒤집기'});button(controls(),'다른 팩 고르기',home)},motionDelay(960))
}
function reveal(id,draw){
 const fresh=!owned.has(id);if(draw){owned.add(id);try{localStorage.setItem(key,JSON.stringify([...owned]));saved=true}catch{saved=false}count()}
 begin(draw?(fresh?'첫 만남':'다시 만난 사상가'):'소장 카드',draw?(saved?'내 컬렉션에 담았어요.':'이번 방문 동안 컬렉션에 담았어요.'):'사상에서 착안한 질문을 읽어 보세요.');
 const [name,theme,q]=people[id];stage().innerHTML='<article class="card"><img src="'+art[id]+'" alt="'+name+' 창작 초상"><div class="info"><div class="serial">HIP讀 · NO. 0'+(id+1)+'</div><h2 class="name">'+name+'</h2><small>'+theme+'</small><p class="question">'+q+'</p></div></article>';
 const bar=controls();button(bar,'팩 다시 열기',home,'gold');button(bar,'컬렉션 보기',collection);
}
function collection(){begin('내 컬렉션',owned.size+' / '+people.length+'명 소장 · '+(owned.size?'카드를 눌러 다시 보세요.':'첫 팩을 열어 사상가를 만나세요.'));const grid=document.createElement('div');grid.className='grid';app.append(grid);[...owned].sort().forEach(id=>{const b=button(grid,'',()=>reveal(id,false));b.innerHTML='<img alt="" src="'+art[id]+'"><b>'+people[id][0]+'</b>'});button(controls(),'팩 고르기',home,'gold')}
album.onclick=collection;home();
